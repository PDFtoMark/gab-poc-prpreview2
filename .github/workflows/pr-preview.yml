name: PR Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

jobs:
  pr-preview:
    permissions:
      contents: read
      actions: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Base preview build
        run: echo "base PR Preview run"
      - name: PR preview
        uses: open-resource-discovery/pr-preview-action@main
        with:
          fork: true
          build-dir: website/build
          target-repo: PDFtoMark/gab-poc-prpreview-worker
          pages-base-url: https://pdftomark.github.io/gab-poc-prpreview-worker
          umbrella-dir: csn-interop-renderer
          token: ${{ secrets.PR_PREVIEW_TOKEN }}
